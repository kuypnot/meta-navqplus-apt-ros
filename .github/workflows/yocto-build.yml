name: Yocto build - NavQPlus (.wic) - full workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - imx-6.1.22-humble

jobs:
  yocto-build:
    runs-on: ubuntu-latest
    timeout-minutes: 1800

    steps:
    - name: Checkout meta-navqplus sources
      uses: actions/checkout@v4
      with:
        repository: rudislabs/meta-navqplus-apt-ros
        ref: imx-6.1.22-humble
        fetch-depth: 1

    - name: Install apt build deps (robust)
      run: |
        set -euo pipefail
        sudo apt-get update

        BASE_PKGS=(
          gawk wget git-core diffstat unzip texinfo gcc-multilib
          build-essential chrpath socat cpio python3 python3-pip
          python3-pexpect xz-utils debianutils iputils-ping python3-git
          python3-jinja2 libsdl1.2-dev rsync locales zstd bc procps
        )

        declare -A CANDIDATES
        CANDIDATES[libegl]="libegl1-mesa libegl-mesa0 libegl1"
        CANDIDATES[pylint]="pylint3 python3-pylint pylint"

        PKGS=("${BASE_PKGS[@]}")

        for key in "${!CANDIDATES[@]}"; do
          avail=""
          for name in ${CANDIDATES[$key]}; do
            if apt-cache show "$name" >/dev/null 2>&1; then
              avail="$name"
              break
            fi
          done
          if [ -n "$avail" ]; then
            PKGS+=("$avail")
            echo "Selected package for $key -> $avail"
          else
            echo "ERROR: None of candidate packages for $key are available: ${CANDIDATES[$key]}"
            exit 1
          fi
        done

        echo "Final apt packages to install:"
        printf '%s\n' "${PKGS[@]}"

        sudo apt-get install -y --no-install-recommends "${PKGS[@]}"

    - name: Prepare workspace (clone poky & layers)
      run: |
        set -euo pipefail
        mkdir -p yocto-sources
        cd yocto-sources

        # clone poky and layers (adjust branches if your meta layer needs different release)
        if [ ! -d poky ]; then
          git clone -b honister https://git.yoctoproject.org/git/poky.git poky
        fi

        if [ ! -d meta-openembedded ]; then
          git clone -b honister https://github.com/openembedded/meta-openembedded.git meta-openembedded
        fi

        if [ ! -d meta-freescale ]; then
          git clone https://github.com/Freescale/meta-freescale.git meta-freescale
        fi

        cd ..

    - name: Show repo and scripts
      run: |
        echo "Workspace: $GITHUB_WORKSPACE"
        ls -la
        ls -la scripts || true
        ls -la yocto-sources/poky || true

    - name: Initialize Yocto env & list image recipes
      run: |
        set -euo pipefail
        # Make sure the poky init script exists
        LS_PATH="${{ github.workspace }}/yocto-sources/poky/oe-init-build-env"
        if [ ! -f "$LS_PATH" ]; then
          echo "ERROR: oe-init-build-env not found at $LS_PATH"
          echo "Contents of yocto-sources:"
          ls -la "${{ github.workspace }}/yocto-sources" || true
          exit 1
        fi

        # temporarily disable nounset only while sourcing the Yocto init script
        ( set +u; source "${{ github.workspace }}/yocto-sources/poky/oe-init-build-env" builddir )

        echo "Listing available imx-image-* recipes:"
        bitbake-layers show-recipes | grep imx-image || true

    - name: Build NavQ+ desktop image (produces .wic)
      env:
        MACHINE: imx8mpnavq
        DISTRO: nxp-lx
        BB_NUMBER_THREADS: "2"
        PARALLEL_MAKE: "-j 2"
      run: |
        set -euo pipefail
        # Source the Yocto init inside a subshell that tolerates 'unset' reads
        ( set +u; source "${{ github.workspace }}/yocto-sources/poky/oe-init-build-env" builddir )
        echo "Yocto build env initialized; now running bitbake imx-image-desktop-imx8mpnavq"
        bitbake imx-image-desktop-imx8mpnavq 2>&1 | tee build.log || true

    - name: Print build summary (tail)
      if: always()
      run: |
        echo "=== LAST 300 LINES OF build.log ==="
        tail -n 300 build.log || true
        echo "=== LIST builddir/tmp/deploy/images/imx8mpnavq ===

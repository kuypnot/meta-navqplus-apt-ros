name: Yocto build - NavQPlus (.wic) - with logs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - imx-6.1.22-humble

jobs:
  yocto-build:
    runs-on: ubuntu-latest
    timeout-minutes: 1800

    steps:
    - name: Checkout meta-navqplus sources
      uses: actions/checkout@v4
      with:
        repository: rudislabs/meta-navqplus-apt-ros
        ref: imx-6.1.22-humble
        fetch-depth: 1

    - name: Install apt build deps (robust)
      run: |
        set -euo pipefail
        sudo apt-get update

        # base list that is stable across ubuntu versions
        BASE_PKGS=(
          gawk wget git-core diffstat unzip texinfo gcc-multilib
          build-essential chrpath socat cpio python3 python3-pip
          python3-pexpect xz-utils debianutils iputils-ping python3-git
          python3-jinja2 libsdl1.2-dev rsync locales zstd bc procps
        )

        # packages that may have different names across Ubuntu releases;
        # each entry is a space-separated list of candidates; the first available is used
        declare -A CANDIDATES
        CANDIDATES[libegl]="libegl1-mesa libegl-mesa0 libegl1"
        CANDIDATES[pylint]="pylint3 python3-pylint pylint"

        # build the final package list
        PKGS=("${BASE_PKGS[@]}")

        for key in "${!CANDIDATES[@]}"; do
          avail=""
          for name in ${CANDIDATES[$key]}; do
            if apt-cache show "$name" >/dev/null 2>&1; then
              avail="$name"
              break
            fi
          done
          if [ -n "$avail" ]; then
            PKGS+=("$avail")
            echo "Selected package for $key -> $avail"
          else
            echo "ERROR: None of candidate packages for $key are available: ${CANDIDATES[$key]}"
            exit 1
          fi
        done

        echo "Final apt packages to install:"
        printf '%s\n' "${PKGS[@]}"

        # install
        sudo apt-get install -y --no-install-recommends "${PKGS[@]}"

    - name: Prepare workspace (clone poky & layers)
      run: |
        set -euo pipefail
        mkdir -p yocto-sources
        cd yocto-sources
        # Use safe default branches; adjust if upstream requires other release
        if [ ! -d poky ]; then git clone -b honister https://git.yoctoproject.org/git/poky.git poky; fi
        if [ ! -d meta-openembedded ]; then git clone -b honister https://github.com/openembedded/meta-openembedded.git meta-openembedded; fi
        if [ ! -d meta-freescale ]; then git clone https://github.com/Freescale/meta-freescale.git meta-freescale; fi
        cd ..

    - name: Prepare environment
      run: |
        # Set up the Yocto environment
        source yocto-sources/poky/oe-init-build-env builddir
        echo "Yocto build environment initialized."

    - name: Show available image recipes (sanity check)
      run: |
        source yocto-sources/poky/oe-init-build-env builddir
        echo "Listing available imx-image-* recipes:"
        bitbake-layers show-recipes | grep imx-image || true

    - name: Build NavQ+ desktop image (produces .wic)
      env:
        MACHINE: imx8mpnavq
        DISTRO: nxp-lx
        BB_NUMBER_THREADS: "2"
        PARALLEL_MAKE: "-j 2"
      run: |
        set -euo pipefail
        source yocto-sources/poky/oe-init-build-env builddir
        echo "Building imx-image-desktop-imx8mpnavq..."
        bitbake imx-image-desktop-imx8mpnavq 2>&1 | tee build.log

        # ensure builddir exists; script will use 'builddir' inside repo
        ./scripts/build.sh 2>&1 | tee build.log || true
        # always exit zero here so we can capture logs and upload artifacts; job will still be marked failed at the end if files missing

    - name: Print build summary (tail)
      if: always()
      run: |
        echo "=== LAST 200 LINES OF build.log ==="
        tail -n 200 build.log || true
        echo "=== LIST builddir/tmp/deploy/images/imx8mpnavq ==="
        ls -la builddir/tmp/deploy/images/imx8mpnavq || true

    - name: Upload build.log and Yocto logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: yocto-logs
        path: |
          build.log
          builddir/tmp/log/*
          builddir/tmp/deploy/images/imx8mpnavq || true

    - name: Upload WIC artifacts (if present)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: navq-wic
        path: |
          builddir/tmp/deploy/images/imx8mpnavq/*.wic*
          builddir/tmp/deploy/images/imx8mpnavq/*.wic.zst
